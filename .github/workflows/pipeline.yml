name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1-5" # weekdays at 06:00 UTC
  workflow_dispatch:
    inputs:
      backfill_days:
        description: Days of history to backfill
        default: "7"
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --only-group dev
      - run: uv run ruff check .
  test:
    name: Tests & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra pipeline
      - name: Type check
        run: uv run ty check
      - name: Run tests
        run: |
          uv run pytest tests/test_ingestion.py tests/test_bronze.py tests/test_silver.py tests/test_gold.py tests/test_forecast.py tests/test_warehouse.py \
            -v --cov=src --cov-report=term-missing --cov-fail-under=70
  docker:
    name: Build image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: currency-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
  pipeline:
    name: Daily pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [lint, test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra pipeline
      - name: Install Stan (required by Prophet)
        run: uv run python -c "import cmdstanpy; cmdstanpy.install_cmdstan()"
      - name: Run pipeline
        run: uv run python run_pipeline.py --backfill-days ${{ github.event.inputs.backfill_days || '7' }}
      - name: Commit data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/bronze/ data/silver/ data/gold/ data/forecasts/ data/warehouse/
          git diff --staged --quiet || git commit -m "chore: update pipeline data [skip ci]"
          git push
